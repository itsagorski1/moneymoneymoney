plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}
version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-forge-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
sourceSets.main.java.setSrcDirs(['src/port/java'])
sourceSets.main.resources { srcDir 'src/generated/resources' }
minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        register('client')
        register('server') { args '--nogui' }
    }
}
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}
dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
}
tasks.named('jar', Jar).configure { archiveClassifier = 'forge-26.3' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
