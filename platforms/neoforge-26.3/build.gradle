plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-neoforge-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
sourceSets.main.java.setSrcDirs(['src/port/java'])
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.blockbench.json'
}
neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}
tasks.named('jar', Jar).configure { archiveClassifier = 'neoforge-26.3' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
