plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-neoforge-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}
repositories { maven { url = 'https://maven.neoforged.net/releases' } }
dependencies { minecraft "net.neoforged:forge:${minecraft_version}-${neo_version}" }
tasks.named('processResources', ProcessResources).configure {
    def replacements = [
        loader_version_range: loader_version_range,
        mod_license: mod_license,
        mod_id: mod_id,
        mod_version: mod_version,
        mod_name: mod_name,
        mod_authors: mod_authors,
        mod_description: mod_description,
        forge_version_range: forge_version_range,
        minecraft_version_range: minecraft_version_range
    ]
    inputs.properties replacements
    filesMatching('META-INF/mods.toml') { expand replacements }
}
tasks.named('jar', Jar).configure {
    archiveClassifier = 'neoforge-1.20.1'
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
